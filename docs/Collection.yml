openapi: 3.1.1
info:
  title: Song Record Collection API
  description: >
    API for managing artists under a record label.
    Demonstrates REST, RPC and GraphQL paradigms.
    All endpoints are secured using HTTP Basic Authentication.
  version: 1.0.0
  contact:
    name: Song Record Collection Support
    email: dev@songcollection.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: http://localhost:8000
    description: Kong API Gateway

# ─────────────────────────────────────────────
# Global Security — Basic Auth
# ─────────────────────────────────────────────
security:
  - basicAuth: []

components:

  # ── Security Scheme ───────────────────────────────────────
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        Supply Base64-encoded "username:password" in the Authorization header.
        Example: Authorization: Basic YWRtaW46c2VjcmV0MTIz (admin:secret123)

  # ── Reusable Schemas ──────────────────────────────────────
  schemas:

    Artist:
      type: object
      description: Full artist record in the label's database.
      required:
        - artist
        - genre
        - albums
      properties:
        id:
          type: integer
          description: Auto-generated unique identifier.
          example: 1
          readOnly: true
        artist:
          type: string
          description: Full display name of the artist.
          minLength: 2
          maxLength: 50
          example: "Kendrick Lamar"
        genre:
          type: string
          description: Primary music genre of the artist.
          pattern: "^[a-zA-Z\\s/-]+$"
          example: "Hip-Hop"
        albums:
          type: integer
          description: Number of albums published under this label.
          minimum: 0
          maximum: 100
          example: 5

    ArtistInput:
      type: object
      description: Payload to register a new artist.
      required:
        - artist
        - genre
        - albums
      properties:
        artist:
          type: string
          minLength: 2
          maxLength: 50
          example: "SZA"
        genre:
          type: string
          example: "R&B"
        albums:
          type: integer
          minimum: 0
          maximum: 100
          example: 2

    # ── RPC Envelopes ───────────────────────────────────────
    RpcListRequest:
      type: object
      description: Input for listArtists RPC call.
      properties:
        page:
          type: integer
          minimum: 0
          default: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          example: 10

    RpcGetRequest:
      type: object
      description: Input for getArtist RPC call.
      required:
        - artistName
      properties:
        artistName:
          type: string
          example: "SZA"

    RpcCreateRequest:
      type: object
      description: Input for createArtist RPC call.
      required:
        - artist
        - genre
        - albums
      properties:
        artist:
          type: string
          example: "Drake"
        genre:
          type: string
          example: "Hip-Hop"
        albums:
          type: integer
          minimum: 0
          example: 7

    RpcResponse:
      type: object
      description: Standard RPC response envelope.
      properties:
        result:
          oneOf:
            - $ref: '#/components/schemas/Artist'
            - type: array
              items:
                $ref: '#/components/schemas/Artist'
        message:
          type: string
          example: "Artist created successfully"
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        count:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      description: Uniform error response returned by all endpoints.
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Artist 'Drake' does not exist"
        path:
          type: string
          example: "/v1/api/rest/artist/Drake"
        timestamp:
          type: string
          example: "2026-04-26T10:30:00"

  # ── Reusable Parameters ───────────────────────────────────
  parameters:

    PageParam:
      name: page
      in: query
      required: false
      description: Page number (0-based). Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    SizeParam:
      name: size
      in: query
      required: false
      description: Number of artists per page. Defaults to 10, max 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 10

    ArtistNamePath:
      name: artistName
      in: path
      required: true
      description: Full name of the artist.
      schema:
        type: string
        minLength: 2
        maxLength: 50
      example: "SZA"

  # ── Reusable Responses ────────────────────────────────────
  responses:

    Unauthorized:
      description: Authentication credentials missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error: "Unauthorized"
            message: "Invalid or missing Basic Auth credentials."
            path: "/v1/api/rest/artists"
            timestamp: "2026-04-26T10:30:00"

    NotFound:
      description: Artist not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: "Not Found"
            message: "Artist 'Drake' does not exist"
            path: "/v1/api/rest/artist/Drake"
            timestamp: "2026-04-26T10:30:00"

    Conflict:
      description: Artist already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            error: "Conflict"
            message: "Artist 'SZA' already exists"
            path: "/v1/api/rest/artist"
            timestamp: "2026-04-26T10:30:00"

    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: "Validation Failed"
            message: "artist: Artist name must not be blank"
            path: "/v1/api/rest/artist"
            timestamp: "2026-04-26T10:30:00"

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error: "Internal Server Error"
            message: "An unexpected error occurred"
            path: "/v1/api/rest/artists"
            timestamp: "2026-04-26T10:30:00"

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════
  # PARADIGM 1 – REST
  # Resource-oriented. HTTP verb = action.
  # ════════════════════════════════════════════

  /v1/api/rest/artists:
    get:
      tags:
        - REST
      summary: Get all artists
      operationId: getAllArtists
      description: >
        Returns a paginated list of all artists.
        Use `page` and `size` to control pagination.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of artists returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artist'
              example:
                - id: 1
                  artist: "Kendrick Lamar"
                  genre: "Hip-Hop"
                  albums: 5
                - id: 2
                  artist: "SZA"
                  genre: "R&B"
                  albums: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/api/rest/artist:
    post:
      tags:
        - REST
      summary: Add a new artist
      operationId: addArtist
      description: >
        Creates a new artist in the database.
        Returns 409 if artist already exists.
      requestBody:
        required: true
        description: Artist data to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistInput'
            example:
              artist: "Drake"
              genre: "Hip-Hop"
              albums: 7
      responses:
        '201':
          description: Artist created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
              example:
                id: 3
                artist: "Drake"
                genre: "Hip-Hop"
                albums: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/api/rest/artist/{artistName}:
    get:
      tags:
        - REST
      summary: Get one artist by name
      operationId: getArtistByName
      description: Returns a single artist identified by their name.
      parameters:
        - $ref: '#/components/parameters/ArtistNamePath'
      responses:
        '200':
          description: Artist returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
              example:
                id: 2
                artist: "SZA"
                genre: "R&B"
                albums: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ════════════════════════════════════════════
  # PARADIGM 2 – RPC
  # Action-oriented. Everything is POST.
  # Response wrapped in { result, message }.
  # ════════════════════════════════════════════

  /v1/api/rpc/listArtists:
    post:
      tags:
        - RPC
      summary: listArtists
      operationId: rpcListArtists
      description: >
        RPC call to fetch all artists.
        Equivalent to REST GET /artists.
        Body: { "page": 0, "size": 10 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcListRequest'
            example:
              page: 0
              size: 10
      responses:
        '200':
          description: Artists returned in result envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcResponse'
              example:
                result:
                  - id: 1
                    artist: "Kendrick Lamar"
                    genre: "Hip-Hop"
                    albums: 5
                page: 0
                size: 10
                count: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/api/rpc/getArtist:
    post:
      tags:
        - RPC
      summary: getArtist
      operationId: rpcGetArtist
      description: >
        RPC call to fetch a single artist.
        Equivalent to REST GET /artist/{artistName}.
        Body: { "artistName": "SZA" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcGetRequest'
            example:
              artistName: "SZA"
      responses:
        '200':
          description: Artist returned in result envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcResponse'
              example:
                result:
                  id: 2
                  artist: "SZA"
                  genre: "R&B"
                  albums: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/api/rpc/createArtist:
    post:
      tags:
        - RPC
      summary: createArtist
      operationId: rpcCreateArtist
      description: >
        RPC call to create a new artist.
        Equivalent to REST POST /artist.
        Body: { "artist": "Drake", "genre": "Hip-Hop", "albums": 7 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcCreateRequest'
            example:
              artist: "Drake"
              genre: "Hip-Hop"
              albums: 7
      responses:
        '200':
          description: Artist created and returned in result envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcResponse'
              example:
                result:
                  id: 3
                  artist: "Drake"
                  genre: "Hip-Hop"
                  albums: 7
                message: "Artist created successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ════════════════════════════════════════════
  # PARADIGM 3 – GraphQL
  # Single endpoint. Client picks fields.
  # Documented here for completeness —
  # use GraphiQL at /graphiql.html for testing.
  # ════════════════════════════════════════════

  /graphql:
    post:
      tags:
        - GraphQL
      summary: GraphQL endpoint
      operationId: graphql
      description: >
        Single endpoint for all GraphQL operations.
        Use GraphiQL playground at /graphiql.html for interactive testing.

        **Example Query — get all artists:**
        ```graphql
        query {
          artists(page: 0, size: 10) {
            id artist genre albums
          }
        }
        ```

        **Example Query — get one artist:**
        ```graphql
        query {
          artist(artistName: "SZA") {
            id artist genre albums
          }
        }
        ```

        **Example Mutation — create artist:**
        ```graphql
        mutation {
          createArtist(input: {
            artist: "Drake"
            genre: "Hip-Hop"
            albums: 7
          }) {
            id artist
          }
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: GraphQL query or mutation string.
                  example: "{ artists(page: 0, size: 10) { id artist genre albums } }"
                variables:
                  type: object
                  description: Optional variables for the query.
      responses:
        '200':
          description: >
            GraphQL always returns 200.
            Errors are in the errors[] array, not HTTP status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Query result data.
                  errors:
                    type: array
                    description: List of errors if any occurred.
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                        extensions:
                          type: object
                          properties:
                            classification:
                              type: string
                            status:
                              type: integer

# ─────────────────────────────────────────────
# Tags
# ─────────────────────────────────────────────
tags:
  - name: REST
    description: >
      Resource-oriented endpoints.
      HTTP verb encodes the action (GET=read, POST=create).
      Identity in the URL (/artist/{artistName}).
      Standard HTTP status codes signal outcome.

  - name: RPC
    description: >
      Action-oriented endpoints.
      Procedure name in the URL (/listArtists, /getArtist).
      Everything is POST. Input always in body.
      Response wrapped in { result, message } envelope.

  - name: GraphQL
    description: >
      Query-oriented single endpoint.
      Client declares exactly which fields it needs.
      No over-fetching or under-fetching.
      Use GraphiQL playground at /graphiql.html.